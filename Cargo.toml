[workspace]
members = [
    "crates/flatasset-core",
    "crates/flatasset-mesh",
    "crates/flatasset-tex",
    "crates/flatasset-world",
    "crates/flatasset-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85.0"
authors = ["Ulquiorra <ulquiorra@antigravity.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flat-formats-rs/flat-formats-asset"
homepage = "https://github.com/flat-formats-rs/flat-formats-asset"

[workspace.dependencies]
flatasset-core = { path = "crates/flatasset-core", version = "0.2.1" }
flatasset-mesh = { path = "crates/flatasset-mesh", version = "0.2.1" }
flatasset-tex = { path = "crates/flatasset-tex", version = "0.2.1" }
flatasset-world = { path = "crates/flatasset-world", version = "0.2.1" }
flatdemo-core = { git = "https://github.com/flat-formats-rs/flat-formats-demo.git", branch = "dev", version = "0.1.0" }

silicon-kit = { git = "https://github.com/ulquiorracode/silicon-kit-rs.git", branch = "dev", default-features = false, features = ["bits", "snorm", "f16c", "zerocopy", "streaming"] }
odd-int = { git = "https://github.com/ulquiorracode/odd-int-rs.git", branch = "dev", default-features = false, features = ["zerocopy"] }
narrow-ptr = { git = "https://github.com/ulquiorracode/narrow-ptr-rs.git", branch = "dev", default-features = false, features = ["odd-int", "zerocopy"] }

zerocopy = { version = "0.8.63", features = ["derive"] }
blake3 = "1.8.7"
zstd = "0.14.3"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.5.1"
memmap2 = "0.9.12"
memchr = "2.7.4"
rayon = "1.10.0"
arc-swap = "1.7.1"
tempfile = "3.17.1"
anyhow = "1.0.104"
proptest = "1.4.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

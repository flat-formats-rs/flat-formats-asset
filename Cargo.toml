[workspace]
members = [
    "crates/flatasset-core",
    "crates/flatasset-mesh",
    "crates/flatasset-tex",
    "crates/flatasset-world",
    "crates/flatasset-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["Ulquiorra <ulquiorra@antigravity.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flat-formats-rs/flat-formats-asset"
homepage = "https://github.com/flat-formats-rs/flat-formats-asset"

[workspace.dependencies]
flatasset-core = { path = "crates/flatasset-core", version = "0.1.0" }
flatasset-mesh = { path = "crates/flatasset-mesh", version = "0.1.0" }
flatasset-tex = { path = "crates/flatasset-tex", version = "0.1.0" }
flatasset-world = { path = "crates/flatasset-world", version = "0.1.0" }
flatdemo-core = { path = "../flat-formats-demo/core/flatdemo-core", version = "0.1.0" }

silicon-kit = { path = "../../silicon-kit-rs", version = "0.1.0" }
odd-int = { path = "../../odd-int-rs", version = "0.1.0" }
narrow-ptr = { path = "../../narrow-ptr-rs", version = "0.1.0" }
zerocopy = { version = "0.8.63", features = ["derive"] }
blake3 = "1.8.7"
zstd = "0.14.3"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.5.1"
memmap2 = "0.9.12"
memchr = "2.7.4"
rayon = "1.10.0"
arc-swap = "1.7.1"
tempfile = "3.17.1"
anyhow = "1.0.104"
proptest = "1.4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
